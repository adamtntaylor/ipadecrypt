name: Refresh Project Insight Poshmark Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
  push:
    paths:
      - 'project-insight-public-api/scrape_poshmark.py'
      - '.github/workflows/project-insight-poshmark-refresh.yml'

permissions:
  contents: write

concurrency:
  group: project-insight-poshmark-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh from public Poshmark pages
        env:
          POSHMARK_MAX_LISTINGS: '48'
        run: python project-insight-public-api/scrape_poshmark.py

      - name: Publish refreshed catalog
        run: |
          if git diff --quiet -- project-insight-public-api/v1/listings project-insight-public-api/images/poshmark; then
            echo "No catalog changes to publish."
            exit 0
          fi
          git config user.name "Project Insight Catalog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add project-insight-public-api/v1/listings project-insight-public-api/images/poshmark
          git commit -m "Refresh Project Insight public Poshmark catalog"
          git push
